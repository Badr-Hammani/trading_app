# XAUUSD Command Center — local stack.
#
#   cp .env.example .env      (fill in AUTH_SECRET; API keys are optional)
#   docker compose up --build
#   open http://localhost:3000
#
# Works the same on Windows, macOS and Linux with Docker Desktop.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xau}
      POSTGRES_DB: ${POSTGRES_DB:-xau_command_center}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-xau} -d ${POSTGRES_DB:-xau_command_center}']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-xau}:${POSTGRES_PASSWORD:-xau}@db:5432/${POSTGRES_DB:-xau_command_center}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Casablanca}
      DEFAULT_SYMBOL: ${DEFAULT_SYMBOL:-XAUUSD}
      # All optional. The app is fully usable with every one of these empty.
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      OANDA_API_KEY: ${OANDA_API_KEY:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      # Screenshots survive a container rebuild.
      - uploads:/app/uploads

volumes:
  postgres-data:
  uploads:
